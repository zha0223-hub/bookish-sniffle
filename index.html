<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangers</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 20px; }
        .upload-section { background: #1e1e1e; padding: 15px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        .upload-section input[type="password"] { background: #2a2a2a; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; width: 120px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 10px; display: flex; flex-direction: column; }
        .video-wrapper { position: relative; width: 100%; border-radius: 4px 4px 0 0; background: black; cursor: pointer; overflow: hidden; }
        video { width: 100%; display: block; }
        .progress-container { width: 100%; height: 4px; background: #2a2a2a; position: relative; margin-bottom: 10px; border-radius: 0 0 4px 4px; }
        .progress-bar { height: 100%; width: 0%; background: #ff3e3e; transition: width 0.1s linear; }
        .play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px); border: 2px solid white; color: white;
            width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; pointer-events: none;
        }
        .title-container { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
        h3 { margin: 0; font-size: 16px; color: #aaa; text-transform: capitalize; word-break: break-all; }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; transition: color 0.2s; }
        .action-btns button:hover { color: white; }
        .action-btns .del-btn:hover { color: #ff3e3e; }
        .controls-container { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; border-top: 1px solid #2a2a2a; }
        .volume-container { display: flex; align-items: center; gap: 8px; width: 100%; }
        .volume-icon { font-size: 14px; color: #888; user-select: none; }
        .volume-slider { flex-grow: 1; accent-color: #ffffff; cursor: pointer; height: 4px; }
        #theaterMode {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); z-index: 10000; justify-content: center; align-items: center;
        }
        #theaterVideo { max-width: 90%; max-height: 85%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #fff; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; font-size: 16px; }
        .back-btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ Bangers</h1>
        <div class="upload-section">
            <input type="file" id="videoFile" accept="video/*">
            <input type="password" id="videoPassword" placeholder="Set Password">
            <button onclick="uploadVideo()">Upload</button>
        </div>
    </header>
    <div class="grid" id="videoGrid"></div>
    <div id="theaterMode">
        <button class="back-btn" onclick="closeTheater()">← Back</button>
        <video id="theaterVideo" controls autoplay loop></video>
    </div>
    <script>
        const API_URL = '/api';
        const MAX_FILE_SIZE = 100 * 1024 * 1024;

        async function loadBangers() {
            const res = await fetch(`${API_URL}/list`);
            const videos = await res.json();
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach((video, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="video-wrapper" onclick="openTheater('${video.url}')">
                        <video src="${video.url}" loop id="vid-${index}" ontimeupdate="updateProgress('vid-${index}', 'progress-${index}')" muted></video>
                        <div class="play-btn">▶</div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-${index}"></div>
                    </div>
                    <div class="title-container">
                        <h3>${video.title.replace(/_/g, ' ')}</h3>
                        <div class="action-btns">
                            <button onclick="event.stopPropagation(); renameBanger('${video.id}')">✏️</button>
                            <button class="del-btn" onclick="event.stopPropagation(); deleteBanger('${video.id}')">🗑️</button>
                        </div>
                    </div>
                    <div class="controls-container">
                        <div class="volume-container">
                            <span class="volume-icon">🔊</span>
                            <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0" oninput="changeVolume('vid-${index}', this.value); event.stopPropagation();" onclick="event.stopPropagation();">
                        </div>
                    </div>
                `;
                grid.appendChild(card);
                setTimeout(() => { document.getElementById(`vid-${index}`).play().catch(()=>{}); }, 100);
            });
        }

        function openTheater(videoUrl) {
            document.querySelectorAll('video').forEach(v => v.pause());
            const theater = document.getElementById('theaterMode');
            const tVideo = document.getElementById('theaterVideo');
            tVideo.src = videoUrl;
            tVideo.volume = 1; 
            theater.style.display = 'flex';
        }

        function closeTheater() {
            const theater = document.getElementById('theaterMode');
            const tVideo = document.getElementById('theaterVideo');
            tVideo.pause();
            tVideo.src = '';
            theater.style.display = 'none';
            loadBangers(); 
        }

        async function renameBanger(id) {
            const newTitle = prompt("Enter a new title for this clip:");
            if (!newTitle) return;
            const password = prompt("Enter password:");
            if (!password) return;

            const res = await fetch(`${API_URL}/rename`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, newTitle, password })
            });
            const data = await res.json();
            if (res.ok) { loadBangers(); } else { alert(data.error); }
        }

        async function deleteBanger(id) {
            const password = prompt("Enter password to delete:");
            if (!password) return;

            const res = await fetch(`${API_URL}/delete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password })
            });
            const data = await res.json();
            if (res.ok) { loadBangers(); } else { alert(data.error); }
        }

        function updateProgress(videoId, progressBarId) {
            const video = document.getElementById(videoId);
            const progressBar = document.getElementById(progressBarId);
            if (video && progressBar && video.duration) {
                const percentage = (video.currentTime / video.duration) * 100;
                progressBar.style.width = `${percentage}%`;
            }
        }

        function changeVolume(videoId, value) {
            const video = document.getElementById(videoId);
            if (video) video.volume = value;
        }

        async function uploadVideo() {
            const fileInput = document.getElementById('videoFile');
            const passwordInput = document.getElementById('videoPassword');
            
            if (fileInput.files.length === 0) return alert('Select a file first!');
            const file = fileInput.files[0];

            if (file.size > MAX_FILE_SIZE) {
                return alert('Hold up! That file is too big. Keep it under 100MB.');
            }

            const formData = new FormData();
            formData.append('video', file);
            formData.append('password', passwordInput.value);

            try {
                const res = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    fileInput.value = '';
                    passwordInput.value = '';
                    loadBangers();
                } else { alert(data.error || 'Upload failed.'); }
            } catch (err) { alert('Server error: connection failed.'); }
        }

        loadBangers();
    </script>
</body>
</html>
